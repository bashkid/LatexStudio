[project]
name = "latexstudio"
version = "0.1.0"
description = "An Overleaf-style LaTeX editor for any project folder on your computer: no account, nothing leaves the machine."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pymupdf>=1.24", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
latexstudio = "latexstudio.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["latexstudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
