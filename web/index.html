<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>LaTeX Studio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>try{var t=localStorage.getItem("ls.theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.theme="dark"}catch(e){}</script>
    <style>
      html,body{margin:0;background:#f7f8fc;color:#0f172a}
      html[data-theme="dark"],html[data-theme="dark"] body{background:#0b0f1a;color:#e5e7eb}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
